# Generated by npm-dual-publish. Edit the template, not this file.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against runaway patch versions
        run: |
          PATCH="${GITHUB_REF_NAME##*.}"
          if [ "${PATCH:-0}" -ge 20 ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} has patch >= 20, bump the minor version (reset patch) instead of more patches."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Tokenless trusted publishing (OIDC) needs a recent npm.
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build
      - run: git diff --exit-code -- README.md
      - run: npx vitest run

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --allow-same-version --no-git-tag-version

      - name: Publish unscoped
        run: npm publish --access public

      - name: Publish scoped
        run: |
          npm pkg set name="@intisy-ai/plugin-updater"
          npm publish --access public
