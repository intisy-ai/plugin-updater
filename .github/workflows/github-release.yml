# Generated by npm-dual-publish. Edit the template, not this file.
name: GitHub pre-release

on:
  push:
    tags:
      - 'gh-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against runaway patch versions
        run: |
          PATCH="${GITHUB_REF_NAME##*.}"
          if [ "${PATCH:-0}" -ge 20 ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} has patch >= 20, bump the minor version (reset patch) instead of more patches."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: git diff --exit-code -- README.md
      - run: npx vitest run

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#gh-v}"
          npm version "$VERSION" --allow-same-version --no-git-tag-version

      # The directory is created first: --pack-destination does not create it, and npm fails with
      # ENOENT on the tarball it was about to write.
      - run: mkdir -p release-asset && npm pack --pack-destination release-asset

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-asset/*.tgz --prerelease --title "$GITHUB_REF_NAME" --generate-notes
